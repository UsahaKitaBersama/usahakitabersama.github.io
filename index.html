<script>
const el=document.getElementById("app");
const rp=n=>"Rp"+Math.round(n||0).toLocaleString("id-ID");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
async function hash(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("kasir:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const T={baru:"Baru",proses:"Diproses",selesai:"Selesai",batal:"Dibatalkan"};
let db=null,S={cfg:null,products:[],orders:[],expenses:[],staff:[],flash:[],vouchers:[]},ready={},me=null,tab="orders",flt="aktif",cart=[],draft={n:"",c:""},sent=null,msg="",armed="",pending=false,slow=false,waText='',waLink='',noCfg=false,sheet=null,qv='',catf='',pf={},vch=null,geo=null,pmSel='Tunai',vmsg='',vf={},xf={},sd={},qd='',mapMode='',mapMv=null,trk='',TK=null,trkShow=false,unTrk=null,pr={},billData={},pz=0,cc=0;

const isCust=()=>location.hash!=="#admin";
let MENU={};try{MENU=JSON.parse(document.getElementById('menu').textContent)||{}}catch(e){}
const NL=String.fromCharCode(10);
const WA=()=>String((S.cfg&&S.cfg.wa)||MENU.wa||'').split('').filter(c=>c>='0'&&c<='9').join('');
const SHOP=()=>(S.cfg&&S.cfg.shop)||MENU.shop||'Toko';
const beep=()=>{try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},250)}catch(e){}};
const $=s=>document.querySelector(s);const val=s=>($(s)||{}).value||"";
function flash(m){msg=m;render(true);setTimeout(()=>{msg="";render()},3000)}

function render(force){
  const a=document.activeElement;
  if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pending=true;return}
  pending=false;el.innerHTML=view();if(S.cfg&&S.cfg.color){const r=document.documentElement.style;r.setProperty('--ac',S.cfg.color);r.setProperty('--ac2','#fff')}mapInit();const q=document.getElementById("qr");if(q&&window.QRCode)new QRCode(q,{text:location.href.split("#")[0],width:140,height:140});
}
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(pending&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()},60));
document.addEventListener("input",e=>{if(e.target.id==="cn")draft.n=e.target.value;if(e.target.id==="cc")draft.c=e.target.value;if(e.target.id==="cp")draft.p=e.target.value;if(e.target.dataset.v)vf[e.target.dataset.v]=e.target.value;if(e.target.dataset.r)pr[e.target.dataset.r]=e.target.value;if(e.target.dataset.x)xf[e.target.dataset.x]=e.target.value;if(e.target.dataset.f)pf[e.target.dataset.f]=e.target.value;if(e.target.id==="qs"){qv=e.target.value;render(true);const x=document.getElementById("qs");x.focus();x.setSelectionRange(x.value.length,x.value.length)}if(e.target.id==="ct"){draft.t=e.target.value;render(true)}if(e.target.id==="cm")draft.m=e.target.value;if(e.target.id==="cash"){const c=document.getElementById("chg");if(c)c.textContent=e.target.value?"Kembalian: "+rp(e.target.value-cartTot()):""}});
window.addEventListener("hashchange",()=>render(true));

function view(){
  if(noCfg)return`<div class="wrap"><div class="card"><h2>Konfigurasi Firebase belum diisi</h2><p>Isi file firebase-config.js sesuai README.</p></div></div>`;
  if(isCust()&&(!db||ready.cfg))return custView()+waBtn();
  if(!db)return`<div class="wrap"><div class="card"><h2>Perlu masuk ke Claude</h2><p>Aplikasi ini menyimpan data bersama, jadi pembukanya harus masuk (login) dan punya izin Kontributor. Setelah itu muat ulang halaman.</p></div></div>`;
  if(!ready.cfg)return`<div class="wrap"><p class="muted">${slow?"Data belum termuat. Periksa koneksi lalu muat ulang.":"Memuat…"}</p></div>`;
  if(isCust())return custView();
  if(!S.cfg)return setupView();
  if(!me)return loginView();
  return appView();
}

/* ---------- Pelanggan ---------- */
const normPhone=v=>{let d=String(v||'').replace(/[^0-9]/g,'');if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return /^628[1-9][0-9]{7,10}$/.test(d)?d:''};
const lastOrder=()=>{try{return +localStorage.getItem('lo')||0}catch(e){return 0}};
const markOrder=()=>{try{localStorage.setItem('lo',String(Date.now()))}catch(e){}};
const all=()=>S.products.length?S.products:(MENU.items||[]);
const prods=()=>all().filter(p=>p.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const items=()=>cart.map(x=>({id:x.id,name:x.name,price:lp(x),qty:x.qty,opt:x.opt||'',x:x.x||0}));
const cartTot=()=>cart.reduce((s,x)=>s+lp(x)*x.qty,0);
const inCart=id=>cart.filter(x=>x.id===id).reduce((s,x)=>s+x.qty,0);
const parseOpts=t=>String(t||'').split('\n').map(l=>{const i=l.indexOf(':');if(i<1)return null;const c=l.slice(i+1).split(',').map(x=>{x=x.trim();const m=x.match(/^(.*?)\s*\+\s*(\d+)$/);return m?{l:m[1],p:+m[2]}:{l:x,p:0}}).filter(x=>x.l);return c.length?{n:l.slice(0,i).trim(),c}:null}).filter(Boolean);
const optsTxt=o=>(o||[]).map(g=>g.n+': '+g.c.map(c=>c.l+(c.p?' +'+c.p:'')).join(', ')).join('\n');
const shrink=(f,m,q)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q||0.75))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)});
const PS={menunggu:'Menunggu Pembayaran',berhasil:'Berhasil',kurang:'Kurang Bayar',gagal:'Gagal',kedaluwarsa:'Kedaluwarsa',tunai:'Bayar Tunai'};
const effPs=o=>o.ps==='menunggu'&&o.exp&&Date.now()>o.exp?'kedaluwarsa':o.ps;
const fmtCd=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600);return(h?h+':':'')+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const dl=t=>t?new Date(t).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}):'—';
const flashPrice=(b,f)=>f.mode==='pct'?Math.round(b*(100-f.val)/100):Math.min(b,f.val);
const flashOf=(pid,at,noq)=>{at=at||Date.now();return S.flash.find(f=>f.pid===pid&&f.on!==false&&f.s<=at&&at<f.e&&(noq||f.q==null||(f.sold||0)<f.q))};
const fLeft=f=>f.q==null?null:Math.max(0,f.q-(f.sold||0));
const unitBase=p=>{const f=flashOf(p.id);return f?flashPrice(p.price,f):p.price};
const capOf=p=>{const f=flashOf(p.id);return Math.min(p.stock==null?1e9:p.stock,f?Math.min(f.lim==null?1e9:f.lim,f.q==null?1e9:fLeft(f)):1e9)};
const lp=L=>{const p=all().find(x=>x.id===L.id);return p?unitBase(p)+(L.x||0):L.price};
const vErr=(v,sub,u,uc,at)=>{const n=at||Date.now();if(!v||v.on===false)return'Voucher tidak ditemukan';if(v.s&&n<v.s)return'Voucher belum berlaku';if(v.e&&n>v.e)return'Voucher sudah berakhir';if(v.min&&sub<v.min)return'Minimal belanja '+rp(v.min);if(v.lim!=null&&(u||0)>=v.lim)return'Kuota voucher habis';if(v.lc!=null&&(uc||0)>=v.lc)return'Batas pemakaian voucher tercapai';return''};
const vDisc=(v,sub,ship)=>{let d=0;if(v.t==='pct')d=Math.min(Math.floor(sub*v.val/100),v.max||1e12);else if(v.t==='nom')d=Math.min(v.val,sub);else if(v.t==='free')d=Math.min(ship,v.max||1e12);else if(v.t==='cut')d=Math.min(v.val,ship);return Math.max(0,d)};
const vDesc=v=>v.t==='pct'?'Diskon '+v.val+'%':v.t==='nom'?'Diskon '+rp(v.val):v.t==='free'?'Gratis ongkir':'Potongan ongkir '+rp(v.val);
const getV=async c=>{const s=await db.doc('vouchers/'+c).get();return s.exists?{...s.data(),id:c}:null};
const getVU=(c,p)=>db.doc('vu/'+c+'_'+p).get().then(s=>s.exists?s.data().n:0).catch(()=>0);
const shipFee=km=>{const c=S.cfg,k=c.shipCeil===false?km:Math.ceil(km);return Math.max(c.shipMin||0,Math.round(k*(c.shipRate||0)))+(c.shipExtra||0)};
async function routeKm(a,b,c,d){try{const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+b+','+a+';'+d+','+c+'?overview=false'),j=await r.json();return j.routes&&j.routes[0]?j.routes[0].distance/1000:null}catch(e){return null}}
const geoMsg=()=>!geo?'Geser pin ke lokasi pengantaran atau cari alamat.':geo.busy?'Menghitung ongkir…':geo.msg?geo.msg:'Jarak '+geo.km.toFixed(1)+' km · Ongkir '+rp(geo.fee);
const calc=()=>{const sub=cartTot(),c=S.cfg||{},ant=draft.t==='Antar'&&c.shipOn===true,ship=ant&&geo&&geo.ok?geo.fee:0;let disc=0;if(vch&&!vErr(vch,sub,vch.used,vch.uc))disc=vDisc(vch,sub,ship);return{sub,ship,disc,total:Math.max(0,sub+ship-disc)}};
const bd=()=>{const c=calc();return`<div class="row sp"><span>Subtotal</span><span>${rp(c.sub)}</span></div>${draft.t==='Antar'?`<div class="row sp"><span>Ongkir</span><span>${geo&&geo.ok?rp(c.ship):'—'}</span></div>`:''}${c.disc?`<div class="row sp"><span>Diskon (${esc(vch.id)})</span><span>−${rp(c.disc)}</span></div>`:''}<div class="tot"><span>Total</span><b>${rp(c.total)}</b></div>`};
const paint=()=>{const b=document.getElementById('bd');if(b)b.innerHTML=bd();const s=document.getElementById('sinfo');if(s&&mapMode==='cust')s.textContent=geoMsg();const m=document.getElementById('vmsg');if(m)m.textContent=vmsg};
async function onPin(la,ln){
  if(mapMode==='store'){sd={lat:la,lng:ln};const s=document.getElementById('sinfo');if(s)s.textContent='Lokasi toko: '+la.toFixed(5)+', '+ln.toFixed(5);return}
  const c=S.cfg;geo={lat:la,lng:ln,busy:true};paint();
  const km=await routeKm(c.lat,c.lng,la,ln);if(!geo||geo.lat!==la)return;
  if(km==null)geo={lat:la,lng:ln,msg:'Rute tidak ditemukan. Coba geser pin ke jalan terdekat.'};
  else if(km>(c.shipMax||1e9))geo={lat:la,lng:ln,msg:'Di luar jangkauan: '+km.toFixed(1)+' km (maks '+c.shipMax+' km). Pengiriman tidak tersedia.'};
  else geo={lat:la,lng:ln,ok:true,km,fee:shipFee(km)};
  paint()}
function mapInit(){const b=document.getElementById('map');if(!b||!window.L)return;const c=S.cfg||{},d={lat:c.lat!=null?c.lat:-6.2,lng:c.lng!=null?c.lng:106.8},p=mapMode==='store'?(sd.lat!=null?sd:d):(geo&&geo.lat!=null?geo:d);
  const m=L.map(b).setView([p.lat,p.lng],15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(m);
  const mk=L.marker([p.lat,p.lng],{draggable:true}).addTo(m);
  mk.on('dragend',()=>{const q=mk.getLatLng();onPin(q.lat,q.lng)});m.on('click',e=>{mk.setLatLng(e.latlng);onPin(e.latlng.lat,e.latlng.lng)});
