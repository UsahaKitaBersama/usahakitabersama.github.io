<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Toko</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Konfigurasi Firebase proyek "kasir"
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyBOnv7MqMLCGpgeJ8h5Z1UFj8zlxkakLcY",
  authDomain: "kasir-7f510.firebaseapp.com",
  projectId: "kasir-7f510",
  storageBucket: "kasir-7f510.firebasestorage.app",
  messagingSenderId: "24386041160",
  appId: "1:24386041160:web:d91798a2088b06a998af7d"
};
</script>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d9;--ac:#0f766e;--ac2:#fff;--dg:#b42318;--ok:#067647;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--sf:#1f1f1d;--tx:#f1f0ea;--mu:#a3a199;--bd:#34332f;--ac:#2dd4bf;--ac2:#06201d;--dg:#f97066;--ok:#47cd89;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--sf:#1f1f1d;--tx:#f1f0ea;--mu:#a3a199;--bd:#34332f;--ac:#2dd4bf;--ac2:#06201d;--dg:#f97066;--ok:#47cd89;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0}h2{font-size:17px;margin:0 0 8px}
.muted{color:var(--mu);font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 10px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--bg)}
.tabs button{background:var(--sf);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}
.tabs button.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.tabs i{font-style:normal;background:var(--dg);color:#fff;border-radius:9px;padding:0 6px;font-size:12px}
button{font:inherit;background:var(--ac);color:var(--ac2);border:0;border-radius:9px;padding:9px 14px;cursor:pointer}
a.btn{display:inline-block;background:var(--ac);color:var(--ac2);border-radius:9px;padding:9px 14px;text-decoration:none}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.danger{background:transparent;color:var(--dg);border:1px solid var(--dg)}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center}.row>*{margin:0}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat b{display:block;font-size:18px;margin-top:2px}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 12px}
.badge{font-size:12px;padding:2px 8px;border-radius:9px;background:var(--bd)}
.b-baru{background:var(--dg);color:#fff}.b-proses{background:#b54708;color:#fff}.b-selesai{background:var(--ok);color:#fff}
.toast{background:var(--ac);color:var(--ac2);padding:8px 12px;border-radius:9px;margin-bottom:10px}
.tot{display:flex;justify-content:space-between;font-size:17px;margin:6px 0 10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
</style></head><body><div id="app"></div><script type="application/json" id="menu">{"shop":"","wa":"","items":[]}</script>
<script>
const el=document.getElementById("app");
const rp=n=>"Rp"+Math.round(n||0).toLocaleString("id-ID");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
async function hash(p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("kasir:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const T={baru:"Baru",proses:"Diproses",selesai:"Selesai",batal:"Dibatalkan"};
let db=null,S={cfg:null,products:[],orders:[],expenses:[],staff:[]},ready={},me=null,tab="orders",flt="aktif",cart={},draft={n:"",c:""},sent=null,msg="",armed="",pending=false,slow=false,waText='',waLink='',noCfg=false;

const isCust=()=>location.hash!=="#admin";
let MENU={};try{MENU=JSON.parse(document.getElementById('menu').textContent)||{}}catch(e){}
const NL=String.fromCharCode(10);
const WA=()=>String((S.cfg&&S.cfg.wa)||MENU.wa||'').split('').filter(c=>c>='0'&&c<='9').join('');
const SHOP=()=>(S.cfg&&S.cfg.shop)||MENU.shop||'Toko';
const beep=()=>{try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},250)}catch(e){}};
const $=s=>document.querySelector(s);const val=s=>($(s)||{}).value||"";
function flash(m){msg=m;render(true);setTimeout(()=>{msg="";render()},3000)}

function render(force){
  const a=document.activeElement;
  if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pending=true;return}
  pending=false;el.innerHTML=view();const q=document.getElementById("qr");if(q&&window.QRCode)new QRCode(q,{text:location.href.split("#")[0],width:140,height:140});
}
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(pending&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()},60));
document.addEventListener("input",e=>{if(e.target.id==="cn")draft.n=e.target.value;if(e.target.id==="cc")draft.c=e.target.value;if(e.target.id==="ct")draft.t=e.target.value;if(e.target.id==="cm")draft.m=e.target.value;if(e.target.id==="cash"){const c=document.getElementById("chg");if(c)c.textContent=e.target.value?"Kembalian: "+rp(e.target.value-cartTot()):""}});
window.addEventListener("hashchange",()=>render(true));

function view(){
  if(noCfg)return`<div class="wrap"><div class="card"><h2>Konfigurasi Firebase belum diisi</h2><p>Isi file firebase-config.js sesuai README.</p></div></div>`;
  if(isCust()&&(!db||ready.cfg))return custView();
  if(!db)return`<div class="wrap"><div class="card"><h2>Perlu masuk ke Claude</h2><p>Aplikasi ini menyimpan data bersama, jadi pembukanya harus masuk (login) dan punya izin Kontributor. Setelah itu muat ulang halaman.</p></div></div>`;
  if(!ready.cfg)return`<div class="wrap"><p class="muted">${slow?"Data belum termuat. Periksa koneksi lalu muat ulang.":"Memuat…"}</p></div>`;
  if(isCust())return custView();
  if(!S.cfg)return setupView();
  if(!me)return loginView();
  return appView();
}

/* ---------- Pelanggan ---------- */
const all=()=>S.products.length?S.products:(MENU.items||[]);
const prods=()=>all().filter(p=>p.active!==false).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
const items=()=>all().filter(p=>cart[p.id]).map(p=>({id:p.id,name:p.name,price:p.price,qty:cart[p.id]}));
const cartTot=()=>items().reduce((s,i)=>s+i.price*i.qty,0);
const prodRow=p=>`<div class="card row sp"><div><b>${esc(p.name)}</b><div class="muted">${rp(p.price)}${p.stock!=null?' · stok '+p.stock:''}</div></div><div class="qty"><button class="ghost" data-a="add" data-id="${p.id}" data-d="-1">−</button><b>${cart[p.id]||0}</b><button data-a="add" data-id="${p.id}" data-d="1" ${p.stock!=null&&(cart[p.id]||0)>=p.stock?'disabled':''}>+</button></div></div>`;
function custView(){
  if(!S.cfg&&!(MENU.items&&MENU.items.length))return`<div class="wrap"><div class="card">Toko belum siap menerima pesanan.</div></div>`;
  if(sent)return`<div class="wrap"><div class="card">${waText?`<h2>Satu langkah lagi</h2><p>Nomor pesanan <b>#${esc(sent)}</b>. Kirim pesan WhatsApp ini ke toko agar pesananmu masuk ke kasir.</p>${waLink?`<p><a class="btn" href="${esc(waLink)}" target="_blank" rel="noopener">Kirim lewat WhatsApp</a></p>`:''}<textarea rows="7" readonly onclick="this.select()">${esc(waText)}</textarea>`:`<h2>Pesanan terkirim ✓</h2><p>Nomor pesanan kamu <b>#${esc(sent)}</b>. Kasir akan segera memprosesnya.</p>`}<button data-a="newOrder">Pesan lagi</button></div></div>`;
  const t=cartTot();
  return`<div class="wrap">${msg?`<div class="toast">${esc(msg)}</div>`:""}<h1>${esc(SHOP())}</h1><p class="muted">Pilih menu, isi nama, lalu kirim pesanan.</p>
  ${prods().map(prodRow).join("")||'<p class="muted">Menu belum tersedia.</p>'}
  <div class="card"><input id="cn" placeholder="Nama kamu" value="${esc(draft.n)}"><select id="ct">${['Makan di tempat','Bawa pulang','Antar'].map(t=>`<option ${draft.t===t?'selected':''}>${t}</option>`).join('')}</select><input id="cm" placeholder="No. meja / alamat antar" value="${esc(draft.m||'')}"><textarea id="cc" rows="2" placeholder="Catatan (opsional)">${esc(draft.c)}</textarea>
  <div class="tot"><span>Total</span><b>${rp(t)}</b></div><button data-a="custSend" ${t?"":"disabled"}>Kirim pesanan</button></div></div>`;
}

/* ---------- Setup & Login ---------- */
function setupView(){return`<div class="wrap"><div class="card"><h2>Pengaturan awal</h2><p class="muted">Buat PIN Admin pertama. Hanya orang yang tahu PIN ini yang bisa mengelola toko dan membuat akun kasir.</p>
<input id="sh" placeholder="Nama toko"><input id="pin" type="password" inputmode="numeric" placeholder="PIN Admin (min. 6 angka)"><button data-a="setup">Simpan & mulai</button></div></div>`}
function loginView(){return`<div class="wrap"><div class="card"><h1>${esc(S.cfg.shop||"Toko")}</h1><p class="muted">Masukkan PIN untuk masuk sebagai Admin atau Kasir.</p>${msg?`<div class="toast">${esc(msg)}</div>`:""}
<input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button data-a="login">Masuk</button></div></div>`}

/* ---------- Aplikasi Admin/Kasir ---------- */
function appView(){
  const adm=me.role==="admin",nb=S.orders.filter(o=>o.status==="baru").length;
  const tabs=[["orders","Pesanan"],["pos","Kasir"],["prod","Produk"],["rep","Laporan"]];if(adm)tabs.push(["set","Pengaturan"]);
  const v={orders:ordersView,pos:posView,prod:prodView,rep:repView,set:setView}[tab]||ordersView;
  return`<div class="top"><b>${esc(S.cfg.shop||"Toko")}</b><span class="muted">${esc(me.name)} · ${adm?"Admin":"Kasir"}</span><button class="ghost" data-a="logout">Keluar</button></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?"on":""}" data-a="tab" data-k="${k}">${l}${k==="orders"&&nb?` <i>${nb}</i>`:""}</button>`).join("")}</div>
  <div class="wrap">${msg?`<div class="toast">${esc(msg)}</div>`:""}${v()}</div>`;
}
function ordersView(){
  let os=[...S.orders].sort((a,b)=>b.createdAt-a.createdAt);
  if(flt==="aktif")os=os.filter(o=>o.status==="baru"||o.status==="proses");else if(flt!=="semua")os=os.filter(o=>o.status===flt);
  return`<div class="card"><h2>Impor pesanan WhatsApp</h2><textarea id="imp" rows="2" placeholder="Tempel pesan dari pelanggan di sini"></textarea><button data-a="imp">Impor</button></div><div class="row" style="margin-bottom:10px"><select data-a="flt" id="fl">${[["aktif","Aktif"],["baru","Baru"],["proses","Diproses"],["selesai","Selesai"],["batal","Dibatalkan"],["semua","Semua"]].map(([k,l])=>`<option value="${k}" ${flt===k?"selected":""}>${l}</option>`).join("")}</select></div>
  ${os.map(o=>`<div class="card"><div class="row sp"><b>#${esc(o.code)} · ${esc(o.customer||"Tanpa nama")}</b><span class="badge b-${o.status}">${T[o.status]||o.status}</span></div>
  <div class="muted">${new Date(o.createdAt).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"})} · ${o.source==='online'?'Link pelanggan':'Kasir'}${o.pay?' · '+o.pay:''}${o.type?' · '+esc(o.type)+(o.place?' ('+esc(o.place)+')':''):''}</div>
  <div style="margin:6px 0">${(o.items||[]).map(i=>`${i.qty}× ${esc(i.name)} <span class="muted">(${rp(i.price*i.qty)})</span>`).join("<br>")}</div>
  ${o.note?`<div class="muted">Catatan: ${esc(o.note)}</div>`:""}
  <div class="tot"><span>Total</span><b>${rp(o.total)}</b></div>
  <div class="row">${o.status==="selesai"?`<button class="ghost" data-a="struk" data-id="${o.id}">Kirim struk</button>`:""}${o.status==="baru"?`<button data-a="st" data-id="${o.id}" data-s="proses">Proses</button>`:""}${o.status==="proses"||o.status==="baru"?`<button data-a="st" data-id="${o.id}" data-s="selesai">Selesai & bayar</button><button class="danger" data-a="st" data-id="${o.id}" data-s="batal">Batal</button>`:""}${me.role==="admin"&&(o.status==="selesai"||o.status==="batal")?`<button class="danger" data-a="delOrder" data-id="${o.id}">${armed==="o"+o.id?"Yakin hapus?":"Hapus"}</button>`:""}</div></div>`).join("")||'<p class="muted">Belum ada pesanan.</p>'}`;
}
function posView(){
  const t=cartTot();
  return`${prods().map(prodRow).join("")||'<p class="muted">Tambahkan produk dulu di tab Produk.</p>'}
  <div class="card"><input id="cn" placeholder="Nama pelanggan (opsional)" value="${esc(draft.n)}"><select id="pm"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select><input id="cash" type="number" inputmode="numeric" placeholder="Uang diterima (opsional)"><div class="muted" id="chg" style="margin-bottom:6px"></div><div class="tot"><span>Total</span><b>${rp(t)}</b></div>
  <div class="row"><button data-a="posSave" data-s="selesai" ${t?"":"disabled"}>Bayar (selesai)</button><button class="ghost" data-a="posSave" data-s="proses" ${t?"":"disabled"}>Simpan (diproses)</button><button class="ghost" data-a="clearCart">Kosongkan</button></div></div>`;
}
function prodView(){
  const ps=[...S.products].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  return`<div class="card"><h2>Tambah produk</h2><input id="pn" placeholder="Nama produk"><input id="pp" type="number" inputmode="numeric" placeholder="Harga jual (Rp)"><input id="ps" type="number" inputmode="numeric" placeholder="Stok (kosongkan = tanpa batas)"><button data-a="addProd">Tambah</button></div>
  ${ps.map(p=>`<div class="card"><input id="n-${p.id}" value="${esc(p.name)}"><div class="row"><input id="p-${p.id}" type="number" value="${p.price}"><input id="k-${p.id}" type="number" placeholder="Stok" value="${p.stock==null?'':p.stock}"><button data-a="saveProd" data-id="${p.id}">Simpan</button></div>
  <div class="row" style="margin-top:8px"><button class="ghost" data-a="togProd" data-id="${p.id}">${p.active===false?"Nonaktif · aktifkan":"Aktif · sembunyikan"}</button><button class="danger" data-a="delProd" data-id="${p.id}">${armed==="p"+p.id?"Yakin hapus?":"Hapus"}</button></div></div>`).join("")}`;
}
function repView(){
  const adm=me.role==="admin",td=dkey(Date.now());
  const done=S.orders.filter(o=>o.status==="selesai"),dt=o=>dkey(o.doneAt||o.createdAt);
  const sum=a=>a.reduce((s,x)=>s+(x.total!=null?x.total:x.amount||0),0);
  const tO=done.filter(o=>dt(o)===td),tE=S.expenses.filter(e=>e.date===td);
  const top={};done.forEach(o=>(o.items||[]).forEach(i=>top[i.name]=(top[i.name]||0)+i.qty));
  const topL=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  let h=`<div class="grid"><div class="stat"><span class="muted">Pemasukan hari ini</span><b>${rp(sum(tO))}</b></div><div class="stat"><span class="muted">Pesanan selesai hari ini</span><b>${tO.length}</b></div>`;
  if(adm)h+=`<div class="stat"><span class="muted">Omzet total</span><b>${rp(sum(done))}</b></div><div class="stat"><span class="muted">Pengeluaran hari ini</span><b>${rp(sum(tE))}</b></div><div class="stat"><span class="muted">Pengeluaran total</span><b>${rp(sum(S.expenses))}</b></div><div class="stat"><span class="muted">Laba hari ini</span><b>${rp(sum(tO)-sum(tE))}</b></div><div class="stat"><span class="muted">Laba total</span><b>${rp(sum(done)-sum(S.expenses))}</b></div>`;
  h+=`</div><div class="card" style="margin-top:10px"><h2>Produk terlaris</h2>${topL.map(([n,q])=>`<div class="row sp"><span>${esc(n)}</span><b>${q} terjual</b></div>`).join("")||'<span class="muted">Belum ada data.</span>'}</div>`;
  if(adm){
    const ex=[...S.expenses].sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,15);
    h+=`<div class="card"><h2>Catat pengeluaran bahan</h2><input id="en" placeholder="Nama bahan (mis. Gula 5 kg)"><input id="ea" type="number" inputmode="numeric" placeholder="Total harga (Rp)"><button data-a="addExp">Catat</button></div>
    <div class="card"><h2>Pengeluaran terakhir</h2><div class="tw"><table>${ex.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.name)}</td><td>${rp(e.amount)}</td><td><button class="danger" data-a="delExp" data-id="${e.id}">×</button></td></tr>`).join("")||'<tr><td class="muted">Belum ada.</td></tr>'}</table></div></div>`;
  }
  return h;
}
function setView(){
  const link=location.href.split("#")[0];
  return`<div class="card"><h2>Link pelanggan</h2><p class="muted">Bagikan link ini (atau cetak QR-nya) ke pelanggan, tanpa login. Staf masuk lewat link yang sama + #admin.</p><input readonly value="${esc(link)}" onclick="this.select()"><div id="qr" style="margin:8px 0"></div>
  <input id="ss" placeholder="Nama toko" value="${esc(S.cfg.shop||'')}"><input id="sw" placeholder="Nomor WhatsApp toko (mis. 62812…)" value="${esc(S.cfg.wa||'')}"><button data-a="saveSet">Simpan</button></div>
  <div class="card"><h2>Akun kasir</h2><p class="muted">Hanya Admin yang bisa membuat atau menghapus akun kasir.</p>
  ${S.staff.map(s=>`<div class="row sp" style="margin-bottom:6px"><span>${esc(s.name)} <span class="muted">${s.role==="admin"?"Admin":"Kasir"}</span></span>${s.id===me.uid?"":`<button class="danger" data-a="delStaff" data-id="${s.id}">${armed==="s"+s.id?"Yakin hapus?":"Hapus"}</button>`}</div>`).join("")}
  <input id="kn" placeholder="Nama kasir"><input id="kp" type="password" inputmode="numeric" placeholder="PIN (min. 6 angka)"><select id="kr"><option value="cashier">Kasir</option><option value="admin">Admin</option></select><button data-a="addStaff">Tambah kasir</button></div>
  `;
}

/* ---------- Aksi ---------- */
const col=n=>db.collection(n);
const twice=(k,fn)=>{if(armed===k){armed="";return fn()}armed=k;render(true);setTimeout(()=>{if(armed===k){armed="";render()}},3000)};
const cutStock=async(it,s)=>{for(const i of it){const p=S.products.find(x=>x.id===i.id);if(p&&p.stock!=null)try{await db.doc('products/'+i.id).update({stock:Math.max(0,p.stock-s*i.qty)})}catch(e){}}};
const newOrder=async(status,source)=>{
  const code=String(Date.now()).slice(-5),it=items();
  await col("orders").doc().set({code,items:it,total:cartTot(),status,source,customer:draft.n.trim(),note:draft.c.trim(),type:source==='online'?(draft.t||'Makan di tempat'):'',place:(draft.m||'').trim(),createdAt:Date.now(),doneAt:status==="selesai"?Date.now():null,by:me?me.name:'pelanggan',pay:source==='kasir'?(val('#pm')||'Tunai'):null});await cutStock(it,1);
  cart={};draft={n:"",c:""};return code;
};
const acts={
  add:d=>{const q=Math.max(0,(cart[d.id]||0)+ +d.d);q?cart[d.id]=q:delete cart[d.id];render(true)},
  clearCart:()=>{cart={};render(true)},
  newOrder:()=>{sent=null;waText=waLink='';render(true)},
  tab:d=>{tab=d.k;render(true)},
  logout:()=>auth.signOut(),
  custSend:async()=>{draft.n=val('#cn');draft.c=val('#cc');if(!draft.n.trim())return flash('Isi nama dulu ya');
const sn={n:draft.n.trim(),c:draft.c.trim(),it:items(),t:cartTot()};waText='';waLink='';
try{if(!db||!ready.cfg)throw 0;sent=await newOrder('baru','online')}catch(e){
const code=String(Date.now()).slice(-5),k=btoa(unescape(encodeURIComponent(JSON.stringify({c:code,n:sn.n,k:sn.c,i:sn.it.map(i=>[i.name,i.qty,i.price])}))));
waText='Halo, saya mau pesan:'+NL+sn.it.map(i=>i.qty+'x '+i.name+' ('+rp(i.price*i.qty)+')').join(NL)+NL+'Total: '+rp(sn.t)+NL+'Nama: '+sn.n+(sn.c?NL+'Catatan: '+sn.c:'')+NL+NL+'[[KP:'+k+']]';
waLink=WA()?'https://wa.me/'+WA()+'?text='+encodeURIComponent(waText):'';sent=code;cart={};draft={n:'',c:''}}
render(true)},
imp:async()=>{const t=val('#imp'),a=t.indexOf('[[KP:'),b=t.indexOf(']]',a);if(a<0||b<0)return flash('Kode pesanan tidak ditemukan');
let o;try{o=JSON.parse(decodeURIComponent(escape(atob(t.slice(a+5,b)))))}catch(e){return flash('Kode pesanan rusak')}
if(S.orders.some(x=>x.code===o.c&&x.source==='online'))return flash('Pesanan ini sudah diimpor');
const it=o.i.map(([name,qty,price])=>{const p=S.products.find(x=>(x.name||'').toLowerCase()===name.toLowerCase());return{id:p?p.id:'',name,price:p?p.price:price,qty}});
await col('orders').doc().set({code:o.c,items:it,total:it.reduce((s,i)=>s+i.price*i.qty,0),status:'baru',source:'online',customer:o.n,note:o.k||'',createdAt:Date.now(),doneAt:null,cut:true,by:me.name});
await cutStock(it,1);flash('Pesanan #'+o.c+' diimpor')},
  posSave:async d=>{draft.n=val("#cn");const c=await newOrder(d.s,"kasir");flash("Pesanan #"+c+" tersimpan")},
  st:async d=>{const o=S.orders.find(x=>x.id===d.id)||{},u={status:d.s},on=o.source==='online';if(d.s==='batal'){if(!on||o.cut)await cutStock(o.items||[],-1)}else if(on&&!o.cut){await cutStock(o.items||[],1);u.cut=true}if(d.s==='selesai')u.doneAt=Date.now();await db.doc('orders/'+d.id).update(u)},
  delOrder:d=>twice("o"+d.id,()=>db.doc("orders/"+d.id).delete()),
  addProd:async()=>{const n=val("#pn").trim(),p=+val("#pp");if(!n||!(p>=0)||val("#pp")==="")return flash("Isi nama dan harga");await col("products").doc().set({name:n,price:p,active:true,stock:val('#ps')===''?null:+val('#ps')});flash("Produk ditambahkan")},
  saveProd:async d=>{await db.doc("products/"+d.id).update({name:val("#n-"+d.id).trim(),price:+val('#p-'+d.id),stock:val('#k-'+d.id)===''?null:+val('#k-'+d.id)});flash("Tersimpan")},
  togProd:async d=>{const p=S.products.find(x=>x.id===d.id);await db.doc("products/"+d.id).update({active:p.active===false})},
  delProd:d=>twice("p"+d.id,()=>db.doc("products/"+d.id).delete()),
  addExp:async()=>{const n=val("#en").trim(),a=+val("#ea");if(!n||!(a>0))return flash("Isi nama bahan dan harga");await col("expenses").doc().set({name:n,amount:a,date:dkey(Date.now()),at:Date.now()});flash("Pengeluaran dicatat")},
  delExp:d=>db.doc("expenses/"+d.id).delete(),
  setup:async()=>{const p=val('#pin');if(!/^\d{6,}$/.test(p))return flash('PIN minimal 6 angka');const[em,pw]=await cred(p);let u;
    try{u=(await auth.createUserWithEmailAndPassword(em,pw)).user}catch(e){return flash('Gagal membuat akun: '+(e.code||e.message))}
    const b=db.batch();b.set(db.doc('config/shop'),{shop:val('#sh').trim()||'Toko Saya',wa:''});b.set(db.doc('staff/'+u.uid),{name:'Admin',role:'admin'});await b.commit();
    me={uid:u.uid,role:'admin',name:'Admin'};tab='orders';listenStaff();render(true)},
  login:async()=>{const p=val('#pin');if(!/^\d{6,}$/.test(p))return flash('PIN minimal 6 angka');const[em,pw]=await cred(p);try{await auth.signInWithEmailAndPassword(em,pw)}catch(e){flash('PIN salah')}},
  saveSet:async()=>{await db.doc("config/shop").update({shop:val("#ss").trim()||"Toko Saya",wa:val('#sw').trim()});flash("Pengaturan tersimpan")},
  addStaff:async()=>{const n=val('#kn').trim(),p=val('#kp'),role=val('#kr')||'cashier';if(!n||!/^\d{6,}$/.test(p))return flash('Isi nama dan PIN (min. 6 angka)');
    const[em,pw]=await cred(p),a2=firebase.apps.find(x=>x.name==='sec')||firebase.initializeApp(window.FIREBASE_CONFIG,'sec');let u;
    try{u=(await a2.auth().createUserWithEmailAndPassword(em,pw)).user}catch(e){
      if(e.code!=='auth/email-already-in-use')return flash('Gagal: '+(e.code||e.message));
      try{u=(await a2.auth().signInWithEmailAndPassword(em,pw)).user;if((await db.doc('staff/'+u.uid).get()).exists){await a2.auth().signOut();return flash('PIN sudah dipakai, pilih yang lain')}}catch(x){return flash('PIN sudah dipakai, pilih yang lain')}}
    await db.doc('staff/'+u.uid).set({name:n,role});await a2.auth().signOut();flash('Akun dibuat')},
  delStaff:d=>twice('s'+d.id,()=>db.doc('staff/'+d.id).delete()),
  struk:d=>{const o=S.orders.find(x=>x.id===d.id);if(!o)return;const t=SHOP()+NL+'Struk #'+o.code+NL+(o.items||[]).map(i=>i.qty+'x '+i.name+' = '+rp(i.price*i.qty)).join(NL)+NL+'Total: '+rp(o.total)+(o.pay?NL+'Bayar: '+o.pay:'')+NL+'Terima kasih!';window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')},
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;const f=acts[b.dataset.a];if(f)Promise.resolve().then(()=>f(b.dataset)).catch(x=>flash("Gagal: "+(x.message||x.code||x)))});
document.addEventListener("change",e=>{if(e.target.id==="fl"){flt=e.target.value;render(true)}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pin"){const a=$('[data-a="login"]')||$('[data-a="setup"]');if(a)a.click()}});

/* ---------- Mulai ---------- */
let auth=null,unsubs=[];
const err=e=>flash('Gagal memuat: '+(e.message||e.code));
const cred=async p=>{const h=await hash(p);return[h.slice(0,20)+'@kasir.app',h.slice(20,50)]};
function listenStaff(){
  unsubs.forEach(f=>f());unsubs=[];
  [['orders'],['expenses'],['staff']].forEach(([k])=>{if(k!=='orders'&&me.role!=='admin')return;
    unsubs.push(db.collection(k).onSnapshot(s=>{if(k==='orders'){if(ready.o&&s.docs.length>S.orders.length)beep();ready.o=1}S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},err))})
}
(function(){
  setTimeout(()=>{if(!ready.cfg){slow=true;render()}},10000);
  const C=window.FIREBASE_CONFIG;
  if(!C||!C.projectId||/ISI/.test(C.projectId)){noCfg=true;return}
  firebase.initializeApp(C);db=firebase.firestore();auth=firebase.auth();
  db.doc('config/shop').onSnapshot(s=>{S.cfg=s.exists?s.data():null;ready.cfg=1;render()},err);
  db.collection('products').onSnapshot(s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));render()},err);
  auth.onAuthStateChanged(async u=>{
    if(!u){me=null;unsubs.forEach(f=>f());unsubs=[];render(true);return}
    const d=await db.doc('staff/'+u.uid).get();
    if(d.exists){me={uid:u.uid,role:d.data().role,name:d.data().name};tab='orders';listenStaff()}else if(!me||me.uid!==u.uid)me=null;
    render(true)});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
render(true);
</script></body></html>
