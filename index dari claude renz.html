acts.posSave=d=>{const c=+val('#cash')||0;if(d.s==='selesai'&&c&&c<posNet())return flash('Uang diterima kurang dari total');return ps0(d)};
const busy=new Set(),recent=new Map();
['st','pay'].forEach(k=>{const f=acts[k];acts[k]=async d=>{const o=S.orders.find(x=>x.id===d.id)||{},key=k+':'+d.id+':'+(d.s||'');
  if(busy.has(key)||(recent.get(key)||0)>Date.now())return;
  if(k==='st'&&o.status==='batal')return flash('Pesanan yang sudah dibatalkan tidak bisa diubah');
  if(k==='st'&&o.status===d.s)return;
  busy.add(key);try{await f(d)}finally{busy.delete(key);recent.set(key,Date.now()+4000)}}});
acts.cetak=d=>{const o=S.orders.find(x=>x.id===d.id);if(!o)return;const w=window.open('','_blank','width=380,height=640');if(!w)return flash('Izinkan pop-up untuk mencetak');
  const row=(a,b)=>`<tr><td>${a}</td><td style="text-align:right">${b}</td></tr>`,L=(o.items||[]).map(i=>row(esc(i.qty)+'x '+esc(i.name),rp(i.price*i.qty))).join('');
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Struk #${esc(o.code)}</title><style>@page{size:58mm auto;margin:3mm}body{font:12px monospace;width:52mm;margin:0 auto}table{width:100%;border-collapse:collapse}hr{border:0;border-top:1px dashed #000}h3,p{text-align:center;margin:2px 0}</style><h3>${esc(SHOP())}</h3><p>#${esc(o.code)} ${new Date(o.createdAt).toLocaleString('id-ID')}</p><hr><table>${L}</table><hr><table>${o.sub!=null?row('Subtotal',rp(o.sub)):''}${o.ship?row('Ongkir',rp(o.ship)):''}${o.disc?row('Diskon','-'+rp(o.disc)):''}${row('<b>Total</b>','<b>'+rp(o.total)+'</b>')}${o.pay?row('Bayar',esc(o.pay)):''}${o.cash?row('Diterima',rp(o.cash))+row('Kembalian',rp(Math.max(0,o.cash-o.total))):''}</table><hr><p>Terima kasih!</p><script>onload=()=>print()<\/script>`);w.document.close()};
})();
/* Tahap 5: stok opname + riwayat stok, pelanggan teratas */
(function(){
let opn={},mv=[],mvUn=null;
const pv2=prodView;
prodView=function(){const ps=S.products.filter(p=>p.stock!=null).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  return pv2()+(me.role==='admin'?`<div class="card"><h2>Stok opname</h2><p class="muted">Isi jumlah fisik hasil hitung. Selisih dicatat di riwayat stok.</p>${ps.map(p=>`<div class="row sp" style="margin:6px 0"><span style="flex:1">${esc(p.name)}<div class="muted">Tercatat ${p.stock}</div></span><input data-opn="${p.id}" type="number" inputmode="numeric" min="0" placeholder="Fisik" style="max-width:110px" value="${esc(opn[p.id]!==undefined?opn[p.id]:'')}"></div>`).join('')||'<span class="muted">Tidak ada produk dengan stok.</span>'}<button data-a="saveOpn">Simpan opname</button><h2 style="margin-top:14px">Riwayat stok</h2>${mv.map(m=>`<div class="row sp muted" style="margin:3px 0"><span>${esc(m.name)} · ${esc(m.type)}</span><b>${m.before} → ${m.after}</b></div>`).join('')||'<span class="muted">Belum ada.</span>'}</div>`:'')};
acts.saveOpn=async()=>{const b=db.batch();let n=0;S.products.forEach(p=>{const v=opn[p.id];if(v===undefined||v===''||p.stock==null)return;const a=Math.round(+v);if(!(a>=0)||a===p.stock)return;b.update(db.doc('products/'+p.id),{stock:a});b.set(db.collection('stockMoves').doc(),{pid:p.id,name:p.name,type:'opname',before:p.stock,after:a,by:me.name,at:Date.now()});n++});if(!n)return flash('Tidak ada selisih stok');await b.commit();opn={};flash(n+' produk disesuaikan')};
document.addEventListener('input',e=>{const id=e.target.dataset&&e.target.dataset.opn;if(id!==undefined)opn[id]=e.target.value});
setInterval(()=>{if(!me||me.role!=='admin'){if(mvUn){mvUn();mvUn=null;mv=[]}return}if(db&&!mvUn)mvUn=db.collection('stockMoves').orderBy('at','desc').limit(15).onSnapshot(s=>{mv=s.docs.map(d=>d.data());render()},()=>{})},1000);
const rv2=repView;
repView=function(){const m={};S.orders.filter(o=>o.status==='selesai').forEach(o=>{const k=o.phone||o.customer;if(!k)return;const c=m[k]=m[k]||{n:o.customer||'',ph:o.phone||'',c:0,t:0};c.c++;c.t+=o.total||0});
  const L=Object.values(m).sort((a,b)=>b.t-a.t).slice(0,10);
  return rv2()+`<div class="card"><h2>Pelanggan teratas</h2>${L.map(c=>`<div class="row sp"><span>${esc(c.n||'Tanpa nama')}<div class="muted">${esc(c.ph)} · ${c.c} transaksi</div></span><b>${rp(c.t)}</b></div>`).join('')||'<span class="muted">Belum ada data.</span>'}</div>`};
})();

/* Tahap 6: riwayat aktivitas, penyesuaian stok, ekspor PDF/Excel, tutup kasir */
(function(){
let alog=[],aUn=null,shifts=[],shUn=null;
window.LBL={st:'Ubah status pesanan',pay:'Verifikasi pembayaran',posSave:'Transaksi kasir',saveCosts:'Ubah harga modal',saveOpn:'Stok opname',adjStock:'Penyesuaian stok',saveKas:'Atur saldo awal',saveCb:'Catat kas',delCb:'Hapus catatan kas',bkExport:'Unduh backup',bkImport:'Pulihkan backup',closeShift:'Tutup kasir'};
window.logA=(k,d)=>{try{db.collection('activity').add({a:LBL[k]||k,d:String(d||'').slice(0,60),by:me?me.name:'',at:Date.now()}).catch(()=>{})}catch(e){}};
['st','pay','posSave','saveCosts','saveOpn','adjStock','saveKas','saveCb','bkExport','closeShift'].forEach(k=>{const f=acts[k];if(!f)return;acts[k]=async d=>{const r=await f(d);logA(k,d&&(d.id||d.s));return r}});
const sv3=setView;setView=function(){return sv3()+`<div class="card"><h2>Riwayat aktivitas</h2>${alog.map(x=>`<div class="row sp" style="margin:4px 0"><span>${esc(x.a)}<div class="muted">${esc(x.by)} · ${esc(x.d||'')}</div></span><span class="muted">${new Date(x.at).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')||'<span class="muted">Belum ada.</span>'}</div>`};
const pv3=prodView;prodView=function(){const ps=S.products.filter(p=>p.stock!=null);return pv3()+(me.role==='admin'?`<div class="card"><h2>Penyesuaian stok</h2><p class="muted">Catat stok masuk, keluar, barang rusak, atau hilang. Stok tidak boleh negatif.</p><select id="asp">${ps.map(p=>`<option value="${p.id}">${esc(p.name)} (stok ${p.stock})</option>`).join('')}</select><select id="ast"><option value="masuk">Stok masuk</option><option value="keluar">Stok keluar</option><option value="rusak">Barang rusak</option><option value="hilang">Barang hilang</option></select><input id="asq" type="number" inputmode="numeric" min="1" placeholder="Jumlah"><input id="asn" placeholder="Catatan (opsional)"><button data-a="adjStock">Simpan penyesuaian</button></div>`:'')};
const k0f=r=>{if(r==='all')return'';const d=new Date();d.setHours(0,0,0,0);if(r==='7')d.setDate(d.getDate()-6);else if(r==='30')d.setDate(d.getDate()-29);else if(r==='month')d.setDate(1);return dkey(d)};
const tbl=()=>{const k=k0f(val('#csvr')||'30'),L=S.orders.filter(o=>!k||dkey(o.createdAt)>=k).sort((a,b)=>a.createdAt-b.createdAt),tot=L.filter(o=>o.status==='selesai').reduce((s,o)=>s+(o.total||0),0);return`<table border="1" cellspacing="0" cellpadding="4"><tr><th>Kode</th><th>Tanggal</th><th>Status</th><th>Metode</th><th>Pelanggan</th><th>Total</th></tr>${L.map(o=>`<tr><td>${esc(o.code)}</td><td>${dkey(o.createdAt)}</td><td>${esc(T[o.status]||o.status)}</td><td>${esc(o.pay||o.method||'')}</td><td>${esc(o.customer||'')}</td><td>${o.total||0}</td></tr>`).join('')}<tr><th colspan="5">Total pesanan selesai</th><th>${tot}</th></tr></table>`};
const rv3=repView;repView=function(){return rv3()+`<div class="card"><h2>Cetak / Excel</h2><div class="row"><button data-a="pdf">Cetak / PDF</button><button class="ghost" data-a="xls">Excel (.xls)</button></div><p class="muted">Memakai periode di Ekspor CSV. Untuk PDF, pilih "Simpan sebagai PDF" di jendela cetak.</p></div>`};
const sc=()=>{const k=dkey(Date.now()),mine=S.orders.filter(o=>o.source==='kasir'&&o.status==='selesai'&&o.by===me.name&&dkey(o.doneAt||o.createdAt)===k);return{k,mine,cash:mine.filter(o=>/tunai/i.test(o.pay||'Tunai')).reduce((s,o)=>s+(o.total||0),0)}};
const pos3=posView;posView=function(){const c=sc();return pos3()+`<div class="card"><h2>Tutup kasir</h2><p class="muted">Hari ini ${c.mine.length} transaksi, tunai tercatat ${rp(c.cash)}. Hitung uang di laci lalu simpan untuk mencatat selisih.</p><input id="shop" type="number" inputmode="numeric" placeholder="Saldo awal laci (Rp)"><input id="shfy" type="number" inputmode="numeric" placeholder="Uang fisik di laci (Rp)"><button data-a="closeShift">Tutup kasir</button>${me.role==='admin'?'<h2 style="margin-top:12px">Riwayat tutup kasir</h2>'+(shifts.map(s=>`<div class="row sp muted"><span>${esc(s.by)} · ${esc(s.date)}</span><b>selisih ${s.diff<0?'-':'+'}${rp(Math.abs(s.diff))}</b></div>`).join('')||'Belum ada'):''}</div>`};
const dl=(n,t,ty)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;document.body.appendChild(a);a.click();a.remove()};
Object.assign(acts,{
 adjStock:async()=>{const id=val('#asp'),ty=val('#ast'),q=Math.round(+val('#asq')),p=S.products.find(x=>x.id===id);if(!p||!(q>0))return flash('Pilih produk dan isi jumlah');let bf,af;await db.runTransaction(async tx=>{const sn=await tx.get(db.doc('products/'+id));bf=sn.data().stock;if(bf==null)throw new Error('Stok produk ini tidak dihitung');af=bf+(ty==='masuk'?q:-q);if(af<0)throw new Error('Stok tidak cukup (sisa '+bf+')');tx.update(sn.ref,{stock:af})});await db.collection('stockMoves').add({pid:id,name:p.name,type:ty,qty:q,before:bf,after:af,note:val('#asn').slice(0,80),by:me.name,at:Date.now()});flash('Stok '+p.name+': '+bf+' → '+af)},
 pdf:()=>{const w=window.open('','_blank');if(!w)return flash('Izinkan pop-up untuk mencetak');w.document.write('<!doctype html><meta charset="utf-8"><title>Laporan</title><style>body{font:12px sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:4px;text-align:left}</style><h2>'+esc(SHOP())+' - Laporan pesanan</h2>'+tbl()+'<script>onload=()=>print()<\/script>');w.document.close()},
 xls:()=>dl('laporan-'+dkey(Date.now())+'.xls','<html xmlns:x="urn:schemas-microsoft-com:office:excel"><meta charset="utf-8">'+tbl()+'</html>','application/vnd.ms-excel'),
 closeShift:async()=>{const open=Math.round(+val('#shop'))||0,fy=val('#shfy'),a=Math.round(+fy),c=sc();if(fy===''||!(a>=0))return flash('Isi uang fisik di laci');const diff=a-(open+c.cash);await db.collection('shifts').add({by:me.name,date:c.k,open,exp:open+c.cash,act:a,diff,n:c.mine.length,at:Date.now()});flash('Kasir ditutup. Selisih '+(diff<0?'-':'+')+rp(Math.abs(diff)))}
});
setInterval(()=>{if(!me||me.role!=='admin'){if(aUn){aUn();aUn=null;alog=[]}if(shUn){shUn();shUn=null;shifts=[]}return}if(db&&!aUn)aUn=db.collection('activity').orderBy('at','desc').limit(30).onSnapshot(x=>{alog=x.docs.map(d=>d.data());render()},()=>{});if(db&&!shUn)shUn=db.collection('shifts').orderBy('at','desc').limit(10).onSnapshot(x=>{shifts=x.docs.map(d=>d.data());render()},()=>{})},1000);
})();
</script></body></html>
